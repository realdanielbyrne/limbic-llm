[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "limbic-llm"
version = "0.1.0"
description = "Hippocampally inspired memory modules (DG/CA3/CA2/CA1/Subiculum, Titans hybrid, replay consolidation) for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Daniel Byrne" }]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["limbic_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
